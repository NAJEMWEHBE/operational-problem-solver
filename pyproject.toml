[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-solver"
version = "0.1.2"
description = "Multi-team agentic engine: parallel research + execution workers, consensus stability gate, and an ELO tournament that ships the single best solution."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = { text = "MIT" }
authors = [{ name = "Najm Wahba", email = "najmwahba.98@gmail.com" }]
keywords = ["claude", "anthropic", "agents", "elo", "tournament", "consensus", "code-generation"]
dependencies = [
    "anthropic>=2,<3",
    "pydantic>=2.5",
    "rich>=13.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.17,<0.18"]
fast = ["anthropic[aiohttp]>=2,<3"]

[project.scripts]
ops-solve = "ops_solver.cli:run"

[project.urls]
Homepage = "https://github.com/NAJEMWEHBE/operational-problem-solver"
Repository = "https://github.com/NAJEMWEHBE/operational-problem-solver"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# typer's documented style puts typer.Option/Argument in argument defaults.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
