name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly fresh install: dependencies are open-ended (anthropic>=2,<3, ...), so
  # this catches an SDK release that breaks the adapter before a user does.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip list | grep -iE "^(anthropic|httpx2|pydantic|rich|typer) "
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Test (pytest, offline — no API key)
        run: pytest -q
