name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly fresh install: dependencies are open-ended (anthropic>=2,<3, ...), so
  # this catches an SDK release that breaks the adapter before a user does.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  test:
    # The Linux jobs keep the names the branch rule on main requires
    # ("test (3.11)" ...); the Windows job is "test (windows, 3.13)".
    name: test (${{ matrix.label }}${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # Windows-only code paths (argv handling, helper lookup, process-tree
        # kill, junction/symlink handling) run on one Windows job.
        include:
          - os: windows-latest
            python-version: "3.13"
            label: "windows, "
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip list | grep -iE "^(anthropic|httpx2|pydantic|rich|typer) "
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Test (pytest, offline — no API key)
        run: pytest -q
